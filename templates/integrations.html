{% extends "base.html" %}
{% block content %}
<header class="page-head compact-head"><h1>连接</h1><p class="lead">查看微信对话是否可用。</p></header>

<section class="connection-card">
  <div class="connection-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8.5 17.5 5 20v-4.2A7 7 0 0 1 3 11c0-4.4 4-8 9-8s9 3.6 9 8-4 8-9 8a10.7 10.7 0 0 1-3.5-.5Z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg></div>
  <div class="grow"><h2>微信对话</h2><p>与网页共用商品资料和消息记录</p></div>
  <span class="connection-status {% if last_wechat %}is-online{% else %}is-offline{% endif %}"><i></i>{% if last_wechat %}已连接{% else %}未连接{% endif %}</span>
</section>
{% endblock %}
